<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="2022 개정 교육과정 기반 대평고등학교 편제표">
  <title>편제표 · 대평고등학교 교육과정 안내</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body.page-cur {
      background: var(--bg-cream);
      min-height: 100vh;
    }
    .cur-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }
    .cur-header {
      padding: 32px 0 20px;
      border-bottom: 1px solid var(--ink-100);
      margin-bottom: 24px;
    }
    .cur-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--ink-500);
      margin-bottom: 14px;
      transition: color 0.15s;
    }
    .cur-back:hover { color: var(--green-700); }
    .cur-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--green-900);
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }
    .cur-sub {
      font-size: 14px;
      color: var(--ink-500);
      line-height: 1.6;
    }

    /* 상단 컨트롤 (연도 탭 + 뷰 토글) */
    .cur-top-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    /* 입학년도 탭 */
    .cur-year-tabs {
      display: inline-flex;
      gap: 4px;
      background: #fff;
      border: 1px solid var(--ink-100);
      padding: 5px;
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
    }

    /* 뷰 토글 (모바일에서만 보임) */
    .cur-view-toggle {
      display: none;
      gap: 4px;
      background: #fff;
      border: 1px solid var(--ink-100);
      padding: 5px;
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
    }
    .cur-view-btn {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-500);
      border-radius: 999px;
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }
    .cur-view-btn.active {
      background: var(--green-700);
      color: #fff;
    }
    .cur-year-tab {
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-500);
      border-radius: 999px;
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.2s;
      font-family: inherit;
    }
    .cur-year-tab:hover { color: var(--green-700); }
    .cur-year-tab.active {
      background: var(--green-700);
      color: #fff;
    }

    /* 요약 카드 */
    .cur-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }
    .cur-summary-pill {
      background: #fff;
      border: 1px solid var(--ink-100);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12px;
      color: var(--ink-500);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .cur-summary-pill strong {
      color: var(--green-700);
      font-size: 14px;
    }

    /* 섹션 */
    .cur-section {
      background: #fff;
      border: 1px solid var(--ink-100);
      border-radius: var(--radius-lg);
      margin-bottom: 18px;
      overflow: hidden;
    }
    .cur-section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--green-50, #eef0e8), #fff);
      border-bottom: 1px solid var(--ink-100);
    }
    .cur-section-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green-700);
    }
    .cur-section-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--green-900);
      letter-spacing: -0.02em;
      margin: 0;
    }
    .cur-section-count {
      margin-left: auto;
      font-size: 12px;
      color: var(--ink-500);
    }

    .cur-table-wrap {
      overflow-x: auto;
    }

    /* 편제표 테이블 */
    .cur-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 920px;
    }
    .cur-table thead th {
      background: var(--bg-cream);
      color: var(--ink-500);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 10px 10px;
      text-align: center;
      border-bottom: 1px solid var(--ink-100);
      vertical-align: middle;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .cur-table thead th.th-area { text-align: left; width: 150px; }
    .cur-table thead th.th-name { text-align: left; min-width: 140px; }
    .cur-table thead th.th-credit, .cur-table thead th.th-sem { width: 56px; }
    .cur-table thead th.th-type { width: 70px; }
    .cur-table thead th.th-total, .cur-table thead th.th-required { width: 70px; }
    .cur-table thead tr.th-sub th { padding: 6px 6px; font-size: 10px; background: #f7f8f3; }

    .cur-table tbody td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--ink-100);
      vertical-align: middle;
      line-height: 1.5;
    }
    .cur-table tbody tr:hover { background: var(--bg-cream); }
    .cur-table tbody tr:last-child td { border-bottom: 0; }
    .cur-table .td-area {
      font-weight: 700;
      color: var(--green-900);
      font-size: 12px;
    }
    .cur-table .td-name {
      font-weight: 600;
      color: var(--ink-900);
    }
    .cur-table .td-center { text-align: center; }
    .cur-table .td-credit {
      text-align: center;
      font-weight: 700;
      color: var(--green-700);
      font-family: 'SF Mono', Menlo, monospace;
    }
    .cur-table .td-empty {
      text-align: center;
      color: var(--ink-300);
    }

    /* 유형 뱃지 - 네 가지 색이 명확히 구분되게 */
    .type-chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
    }
    .type-chip.공통 { background: #e5e5e0; color: #4a4a44; }
    .type-chip.일반선택 { background: #eef0e8; color: #4a5e38; }
    .type-chip.진로선택 { background: #ebe4f5; color: #594481; }
    .type-chip.융합선택 { background: #fde7d8; color: #a0491f; }
    .types-stack {
      display: flex; flex-wrap: wrap; gap: 2px;
    }

    /* 선택군 과목 리스트 (하나의 셀에 여러 과목) */
    .subject-choice {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .subject-choice-item {
      display: inline-block;
      padding: 3px 10px;
      background: var(--bg-cream);
      border: 1px solid var(--ink-100);
      border-radius: 999px;
      font-size: 12px;
      color: var(--ink-900);
      font-weight: 500;
    }
    /* 과목별 유형 색상 (subjectTypes 지정 시) - 네 가지 색이 명확히 구분 */
    .subject-choice-item[data-type="공통"] {
      background: #e5e5e0; color: #4a4a44;
      border-color: #d4d4ce;
    }
    .subject-choice-item[data-type="일반선택"] {
      background: #eef0e8; color: #4a5e38;
      border-color: #d9dec9;
    }
    .subject-choice-item[data-type="진로선택"] {
      background: #ebe4f5; color: #594481;
      border-color: #d4ccdf;
    }
    .subject-choice-item[data-type="융합선택"] {
      background: #fde7d8; color: #a0491f;
      border-color: #f2c6a8;
    }
    .choice-badge {
      display: inline-block;
      padding: 3px 10px;
      background: var(--lavender-50);
      color: var(--lavender-700);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    /* 요구사항 요약 */
    .req-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      padding: 16px 20px;
    }
    .req-card {
      background: var(--bg-cream);
      border: 1px solid var(--ink-100);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }
    .req-card-area {
      font-size: 13px;
      font-weight: 700;
      color: var(--green-900);
      margin-bottom: 6px;
    }
    .req-card-nums {
      display: flex;
      gap: 10px;
      font-size: 12px;
      color: var(--ink-500);
    }
    .req-card-nums strong {
      color: var(--green-700);
      font-size: 14px;
      font-family: 'SF Mono', Menlo, monospace;
    }

    /* 범례 */
    .cur-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      padding: 12px 16px;
      background: #fff;
      border: 1px solid var(--ink-100);
      border-radius: var(--radius-md);
      font-size: 12px;
      color: var(--ink-500);
    }
    .cur-legend span { display: inline-flex; align-items: center; gap: 6px; }

    .source-note {
      text-align: center;
      font-size: 12px;
      color: var(--ink-500);
      margin-top: 20px;
      padding: 10px;
    }

    /* ==== 모바일 전용 카드 뷰 ==== */
    .mobile-only { display: none; }

    .m-area-group {
      border: 1px solid var(--ink-100);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 10px;
      background: #fff;
    }
    .m-area-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--ink-100);
    }
    .m-area-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--green-900);
      flex: 1;
    }
    .m-area-stat {
      font-size: 11px;
      color: var(--ink-500);
    }
    .m-area-stat strong {
      color: var(--green-700);
      font-weight: 700;
    }
    .m-subject {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--ink-100);
    }
    .m-subject:last-child { border-bottom: 0; }
    .m-subject-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .m-subject-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-900);
      flex: 1;
      min-width: 0;
    }
    .m-sem-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .m-sem-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      background: var(--bg-cream);
      border: 1px solid var(--ink-100);
      border-radius: 999px;
      font-size: 11px;
      color: var(--ink-500);
    }
    .m-sem-pill strong {
      color: var(--green-700);
      font-weight: 700;
      font-family: 'SF Mono', Menlo, monospace;
    }

    /* 모바일 선택군 카드 */
    .m-elec-group {
      border: 1px solid var(--ink-100);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 10px;
      background: #fff;
    }
    .m-elec-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--ink-100);
      flex-wrap: wrap;
    }
    .m-elec-grade {
      font-size: 10px;
      font-weight: 700;
      color: var(--lavender-700);
      background: var(--lavender-50);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .m-elec-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--green-900);
      flex: 1;
    }
    .m-elec-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    @media (max-width: 820px) {
      .cur-shell { padding: 0 12px 60px; }
      .cur-title { font-size: 22px; }
      .req-grid { grid-template-columns: 1fr 1fr; padding: 12px; }
      .cur-year-tabs {
        display: flex;
        overflow-x: auto;
      }
      .cur-year-tab { padding: 8px 14px; font-size: 12px; white-space: nowrap; }

      /* 모바일에서 뷰 토글 보이기 */
      .cur-view-toggle { display: inline-flex; }

      /* 기본은 카드 모드 */
      body.view-cards .desktop-only { display: none; }
      body.view-cards .mobile-only { display: block; }

      /* 표 모드로 전환하면 테이블 보이기 */
      body.view-table .desktop-only {
        display: block;
      }
      body.view-table .mobile-only { display: none; }

      /* 표 모드일 때 가로 스크롤 + 핀치 줌 안내 */
      body.view-table .cur-table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x pan-y pinch-zoom;
        border-radius: 0;
        position: relative;
      }
      body.view-table .cur-table-wrap::before {
        content: '👉 좌우로 스크롤 · 두 손가락으로 확대';
        display: block;
        font-size: 11px;
        color: var(--ink-500);
        padding: 8px 14px 4px;
        background: var(--bg-cream);
      }
      body.view-table .cur-table {
        min-width: 920px;
        font-size: 12px;
      }
      body.view-table .cur-table thead th { padding: 8px 6px; font-size: 10px; }
      body.view-table .cur-table tbody td { padding: 7px 6px; }

      .cur-section-head { padding: 12px 14px; }
      .cur-section-title { font-size: 14px; }
    }
    @media (max-width: 480px) {
      .req-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="page-cur">
  <div class="cur-shell">
    <header class="cur-header">
      <a href="index.html" class="cur-back">← 처음으로</a>
      <h1 class="cur-title">편제표</h1>
      <p class="cur-sub">입학년도별 전체 과목 편성을 한눈에 볼 수 있어요.</p>
    </header>

    <div class="cur-top-controls">
      <div class="cur-year-tabs" id="yearTabs" role="tablist"></div>
      <div class="cur-view-toggle" id="viewToggle" role="tablist" title="보기 방식 전환">
        <button class="cur-view-btn active" data-view="cards">📱 카드</button>
        <button class="cur-view-btn" data-view="table">📊 표</button>
      </div>
    </div>

    <div class="cur-legend">
      <span><span class="type-chip 공통">공통</span> 공통 과목</span>
      <span><span class="type-chip 일반선택">일반선택</span></span>
      <span><span class="type-chip 진로선택">진로선택</span></span>
      <span><span class="type-chip 융합선택">융합선택</span></span>
      <span style="color:var(--ink-500);"><strong style="color:var(--ink-900);">*</strong> 고시외 과목</span>
    </div>

    <div id="curContent"></div>

    <p class="source-note">자료 출처: 대평고등학교 교육과정 편성표</p>
  </div>

  <script>
    let allData = null;
    let currentYear = (new URLSearchParams(location.search).get('year')) || '2027';
    if (!['2025','2026','2027'].includes(currentYear)) currentYear = '2027';

    // 고시외 과목 (학교 자체 개발) - 표시 시 * 붙임
    const EXTRA_SUBJECTS = new Set([
      '융합사고수학',
      '문화로 보는 한국사',
      '프런티어 사이언스',
    ]);
    const displayName = (name) => EXTRA_SUBJECTS.has(name) ? `${name}*` : name;

    async function init() {
      try {
        const res = await fetch('curriculum.json');
        allData = await res.json();
      } catch (e) {
        document.getElementById('curContent').innerHTML = '<p style="padding:40px;text-align:center;color:#b91c1c;">curriculum.json 로드 실패: ' + e.message + '</p>';
        return;
      }
      renderYearTabs();
      setupViewToggle();
      render();
    }

    // 뷰 전환 (모바일에서만 보임)
    function setupViewToggle() {
      // localStorage에서 이전 선택 복원
      const saved = (() => {
        try { return localStorage.getItem('cur_view'); } catch { return null; }
      })();
      const initialView = saved === 'table' ? 'table' : 'cards';
      applyView(initialView);

      document.querySelectorAll('.cur-view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          applyView(btn.dataset.view);
        });
      });
    }

    function applyView(view) {
      document.body.classList.remove('view-cards', 'view-table');
      document.body.classList.add('view-' + view);
      document.querySelectorAll('.cur-view-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.view === view);
      });
      try { localStorage.setItem('cur_view', view); } catch {}
    }

    function renderYearTabs() {
      const wrap = document.getElementById('yearTabs');
      const labels = {
        '2027': { num: '2027', grade: '예비 1학년' },
        '2026': { num: '2026', grade: '현재 2학년' },
        '2025': { num: '2025', grade: '현재 3학년' },
      };
      wrap.innerHTML = ['2027','2026','2025'].map(y => {
        const active = y === currentYear ? ' active' : '';
        return `<button class="cur-year-tab${active}" data-year="${y}">${labels[y].num} 입학생 · ${labels[y].grade}</button>`;
      }).join('');
      wrap.querySelectorAll('.cur-year-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          currentYear = btn.dataset.year;
          document.querySelectorAll('.cur-year-tab').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          // URL 업데이트 (뒤로가기 등 지원)
          const u = new URL(location.href);
          u.searchParams.set('year', currentYear);
          history.replaceState(null, '', u.toString());
          render();
        });
      });
    }

    function render() {
      const yd = allData[currentYear];
      if (!yd) {
        document.getElementById('curContent').innerHTML = '<p style="padding:40px;text-align:center;color:#b91c1c;">해당 입학년도 데이터가 없어요.</p>';
        return;
      }

      // 요약
      const totalFixed = yd.fixedSubjects.length;
      const totalElectiveGroups = yd.electiveGroups.length;
      const totalElectiveSubjects = yd.electiveGroups.reduce((s,g) => s + g.subjects.length, 0);

      const summaryHtml = `
        <div class="cur-summary">
          <div class="cur-summary-pill">졸업 필수 <strong>${yd.totalCredits || 192}</strong>학점</div>
          <div class="cur-summary-pill">교과 <strong>${yd.subjectCredits || 174}</strong>학점</div>
          <div class="cur-summary-pill">창체 <strong>${yd.creativeCredits || 18}</strong>학점</div>
          <div class="cur-summary-pill">학기당 <strong>${yd.perSemesterCredits || 29}</strong>학점</div>
          <div class="cur-summary-pill">학교지정 <strong>${totalFixed}</strong>과목</div>
          <div class="cur-summary-pill">선택군 <strong>${totalElectiveGroups}</strong>개</div>
        </div>
      `;

      // 요구사항 섹션
      const reqHtml = `
        <div class="cur-section">
          <div class="cur-section-head">
            <span class="cur-section-dot"></span>
            <h3 class="cur-section-title">교과(군)별 필수 이수 학점</h3>
            <span class="cur-section-count">${(yd.requirements||[]).length}개 교과(군)</span>
          </div>
          <div class="req-grid">
            ${(yd.requirements || []).map(r => `
              <div class="req-card">
                <div class="req-card-area">${escapeHtml(r.area)}</div>
                <div class="req-card-nums">
                  <span>필수 <strong>${r.required || 0}</strong></span>
                  <span>영역합계 <strong>${r.total || 0}</strong></span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // 학교지정 과목 테이블
      const fixedHtml = renderFixedSection(yd);

      // 선택군 테이블
      const elecHtml = renderElectiveSection(yd);

      document.getElementById('curContent').innerHTML = summaryHtml + reqHtml + fixedHtml + elecHtml;
    }

    function renderFixedSection(yd) {
      // 교과(군)별로 그룹핑
      const byArea = {};
      const areaOrder = [];
      yd.fixedSubjects.forEach(s => {
        if (!byArea[s.area]) {
          byArea[s.area] = [];
          areaOrder.push(s.area);
        }
        byArea[s.area].push(s);
      });

      // 요구사항에서 교과(군)별 필수/총합 가져오기
      const reqMap = {};
      (yd.requirements || []).forEach(r => {
        reqMap[r.area] = r;
        // 사회(역사/도덕 포함) → "사회" 매핑도
        if (r.area === '사회(역사/도덕 포함)') reqMap['사회'] = r;
      });

      // 각 과목 → 학기별 학점 셀 생성
      const semCols = ['1-1', '1-2', '2-1', '2-2', '3-1', '3-2'];
      const semKey = (g, s) => `${g}-${s}`;

      let rows = '';
      areaOrder.forEach((area, areaIdx) => {
        const subjects = byArea[area];
        subjects.forEach((s, idx) => {
          const sems = {};
          (s.semesters || []).forEach(x => { sems[semKey(x.grade, x.semester)] = x.credits; });
          const type = (s.types && s.types[0]) || '공통';

          const isFirst = idx === 0;
          const rowspan = subjects.length;

          rows += `
            <tr>
              ${isFirst ? `<td class="td-area" rowspan="${rowspan}">${escapeHtml(area)}</td>` : ''}
              <td class="td-name">${escapeHtml(displayName(s.name))}</td>
              <td class="td-credit">${s.baseCredit || ''}</td>
              <td class="td-center"><span class="type-chip ${type}">${type.replace('선택','')}</span></td>
              ${semCols.map(sk => sems[sk] ? `<td class="td-credit">${sems[sk]}</td>` : '<td class="td-empty">·</td>').join('')}
              ${isFirst ? `
                <td class="td-credit" rowspan="${rowspan}">${reqMap[area]?.total ?? '·'}</td>
                <td class="td-credit" rowspan="${rowspan}">${reqMap[area]?.required ?? '·'}</td>
              ` : ''}
            </tr>
          `;
        });
      });

      // 모바일 카드 뷰 생성 (교과(군)별 그룹핑)
      const mobileCards = areaOrder.map(area => {
        const subjects = byArea[area];
        const req = reqMap[area];
        const subjectsHtml = subjects.map(s => {
          const sems = {};
          (s.semesters || []).forEach(x => { sems[semKey(x.grade, x.semester)] = x.credits; });
          const type = (s.types && s.types[0]) || '공통';
          const pills = semCols.filter(sk => sems[sk]).map(sk => {
            const [g, s2] = sk.split('-');
            return `<span class="m-sem-pill">${g}-${s2} <strong>${sems[sk]}</strong></span>`;
          }).join('');
          return `
            <div class="m-subject">
              <div class="m-subject-row">
                <span class="m-subject-name">${escapeHtml(displayName(s.name))}</span>
                <span class="type-chip ${type}">${type.replace('선택','')}</span>
              </div>
              <div class="m-sem-pills">${pills}</div>
            </div>
          `;
        }).join('');
        const reqText = req ? `<span class="m-area-stat">필수 <strong>${req.required||0}</strong> · 합계 <strong>${req.total||0}</strong></span>` : '';
        return `
          <div class="m-area-group">
            <div class="m-area-head">
              <span class="m-area-name">${escapeHtml(area)}</span>
              ${reqText}
            </div>
            ${subjectsHtml}
          </div>
        `;
      }).join('');

      return `
        <div class="cur-section">
          <div class="cur-section-head">
            <span class="cur-section-dot"></span>
            <h3 class="cur-section-title">학교지정 과목</h3>
            <span class="cur-section-count">${yd.fixedSubjects.length}개 과목</span>
          </div>
          <div class="cur-table-wrap desktop-only">
            <table class="cur-table">
              <thead>
                <tr>
                  <th class="th-area" rowspan="2">교과(군)</th>
                  <th class="th-name" rowspan="2">과목명</th>
                  <th class="th-credit" rowspan="2">기본학점</th>
                  <th class="th-type" rowspan="2">유형</th>
                  <th colspan="2">1학년</th>
                  <th colspan="2">2학년</th>
                  <th colspan="2">3학년</th>
                  <th class="th-total" rowspan="2">영역<br>합계</th>
                  <th class="th-required" rowspan="2">필수<br>이수</th>
                </tr>
                <tr class="th-sub">
                  <th class="th-sem">1학기</th><th class="th-sem">2학기</th>
                  <th class="th-sem">1학기</th><th class="th-sem">2학기</th>
                  <th class="th-sem">1학기</th><th class="th-sem">2학기</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="mobile-only" style="padding:14px;">
            ${mobileCards}
          </div>
        </div>
      `;
    }

    function renderElectiveSection(yd) {
      // 학년별로 그룹핑
      const byGrade = { 2: [], 3: [] };
      yd.electiveGroups.forEach(g => {
        const grade = g.grade;
        if (byGrade[grade]) byGrade[grade].push(g);
      });

      const semCols = ['1-1', '1-2', '2-1', '2-2', '3-1', '3-2'];
      const semKey = (g, s) => `${g}-${s}`;

      // 과목별 유형 지정 (subjectTypes가 있으면 과목 pill에 색 반영)
      const subjectTypes = yd.subjectTypes || {};
      const subjectPill = (sub) => {
        const t = subjectTypes[sub];
        const dataType = t ? ` data-type="${escapeHtml(t)}"` : '';
        return `<span class="subject-choice-item"${dataType}>${escapeHtml(displayName(sub))}</span>`;
      };

      let allRows = '';
      [2, 3].forEach(grade => {
        if (byGrade[grade].length === 0) return;
        byGrade[grade].forEach((g, idx) => {
          const sems = {};
          (g.semesters || []).forEach(x => { sems[semKey(x.grade, x.semester)] = x.credits; });
          const types = g.types || [];
          const subjectsHtml = (g.subjects || []).map(subjectPill).join('');

          const isFirst = idx === 0;
          allRows += `
            <tr>
              ${isFirst ? `<td class="td-area" rowspan="${byGrade[grade].length}">${grade}학년<br><span style="font-size:11px;color:var(--ink-500);font-weight:500;">선택</span></td>` : ''}
              <td class="td-name" style="min-width:140px;">${escapeHtml(g.area)}</td>
              <td style="min-width:300px;">
                <div class="choice-badge">택 ${g.selectCount || 1}</div>
                <div class="subject-choice">${subjectsHtml}</div>
              </td>
              <td class="td-center">
                <div class="types-stack">
                  ${types.map(t => `<span class="type-chip ${t}">${t.replace('선택','')}</span>`).join('')}
                </div>
              </td>
              ${semCols.map(sk => sems[sk] ? `<td class="td-credit">${sems[sk]}</td>` : '<td class="td-empty">·</td>').join('')}
              <td class="td-credit">${sems[Object.keys(sems)[0]] * (g.selectCount || 1) || '·'}</td>
            </tr>
          `;
        });
      });

      // 모바일 카드 뷰
      let mobileCards = '';
      [2, 3].forEach(grade => {
        if (byGrade[grade].length === 0) return;
        byGrade[grade].forEach(g => {
          const sems = {};
          (g.semesters || []).forEach(x => { sems[semKey(x.grade, x.semester)] = x.credits; });
          const types = g.types || [];
          const subjectsHtml = (g.subjects || []).map(subjectPill).join('');
          const pills = semCols.filter(sk => sems[sk]).map(sk => {
            const [g2, s2] = sk.split('-');
            return `<span class="m-sem-pill">${g2}-${s2} <strong>${sems[sk]}</strong></span>`;
          }).join('');
          const typeChips = types.map(t => `<span class="type-chip ${t}">${t.replace('선택','')}</span>`).join('');
          mobileCards += `
            <div class="m-elec-group">
              <div class="m-elec-head">
                <span class="m-elec-grade">${grade}학년</span>
                <span class="m-elec-name">${escapeHtml(g.area)}</span>
                <span class="choice-badge">택 ${g.selectCount || 1}</span>
              </div>
              <div class="subject-choice">${subjectsHtml}</div>
              <div class="m-elec-meta">
                ${typeChips}
                ${pills}
              </div>
            </div>
          `;
        });
      });

      return `
        <div class="cur-section">
          <div class="cur-section-head">
            <span class="cur-section-dot"></span>
            <h3 class="cur-section-title">선택 과목</h3>
            <span class="cur-section-count">${yd.electiveGroups.length}개 선택군</span>
          </div>
          <div class="cur-table-wrap desktop-only">
            <table class="cur-table">
              <thead>
                <tr>
                  <th class="th-area" rowspan="2" style="width:70px;">학년</th>
                  <th class="th-name" rowspan="2" style="min-width:140px;">영역</th>
                  <th rowspan="2" style="min-width:300px;">선택 과목</th>
                  <th class="th-type" rowspan="2">유형</th>
                  <th colspan="2">1학년</th>
                  <th colspan="2">2학년</th>
                  <th colspan="2">3학년</th>
                  <th class="th-total" rowspan="2">합계</th>
                </tr>
                <tr class="th-sub">
                  <th class="th-sem">1학기</th><th class="th-sem">2학기</th>
                  <th class="th-sem">1학기</th><th class="th-sem">2학기</th>
                  <th class="th-sem">1학기</th><th class="th-sem">2학기</th>
                </tr>
              </thead>
              <tbody>${allRows}</tbody>
            </table>
          </div>
          <div class="mobile-only" style="padding:14px;">
            ${mobileCards}
          </div>
        </div>
      `;
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    init();
  </script>
</body>
</html>
