<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="2022 개정 교육과정 기반 대평고등학교 교육과정 안내">
  <title>대평고등학교 교육과정 안내</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 입학년도 카드 레이아웃:
       - 2027(예비 1학년): 윗칸 전체 폭
       - 2026, 2025: 아랫칸 가로 2개 */
    .year-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .year-cards .year-card-featured {
      grid-column: 1 / -1;
    }
    @media (max-width: 560px) {
      .year-cards { grid-template-columns: 1fr; }
    }

    /* ===== 제작자 · 문의처 크레딧 ===== */
    .hero-credits {
      margin-top: 18px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--ink-100, #e5e7db);
      border-radius: 12px;
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
      max-width: 540px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .hero-credits-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      flex-wrap: wrap;
    }
    .hero-credits-label {
      display: inline-block;
      min-width: 36px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--green-700, #4a5e38);
      background: var(--bg-cream, #f5f3ec);
      padding: 3px 10px;
      border-radius: 999px;
      text-align: center;
    }
    .hero-credits-text {
      font-weight: 700;
      color: var(--green-900, #2d3a22);
    }
    .hero-credits-email {
      color: var(--green-700, #4a5e38);
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px dashed var(--green-700, #4a5e38);
      transition: color 0.15s, border-color 0.15s;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 13px;
      letter-spacing: -0.01em;
    }
    .hero-credits-email:hover {
      color: var(--green-900, #2d3a22);
      border-bottom-color: var(--green-900, #2d3a22);
    }
    .hero-credits-notice {
      font-size: 11.5px;
      color: var(--ink-500, #6b6b60);
      margin: 6px 0 0;
      line-height: 1.6;
      padding-top: 8px;
      border-top: 1px dashed var(--ink-100, #e5e7db);
    }
    .hero-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    @media (max-width: 560px) {
      .hero-credits { padding: 14px 16px; }
      .hero-credits-row { font-size: 12.5px; gap: 8px; }
      .hero-credits-email { font-size: 12px; }
      .hero-credits-notice { font-size: 11px; }
    }
  </style>
</head>
<body class="page-home">
  <main class="hero">
    <div class="hero-bg" aria-hidden="true">
      <div class="hero-bg-gradient"></div>
      <div class="hero-bg-grid"></div>
    </div>

    <div class="hero-content">
      <div class="hero-banner">
        <span class="hero-logo-wrap">
          <img src="logo.png" alt="대평고등학교 로고" class="hero-logo-animated">
        </span>
        <div class="hero-banner-text">
          <p class="hero-eyebrow">2022 개정 교육과정</p>
          <h2 class="hero-title">대평고등학교 교육과정 안내</h2>
        </div>
      </div>

      <div class="year-select">
        <p class="year-label">입학년도를 선택하세요</p>
        <div class="year-cards">
          <a href="guide.html?year=2027" class="year-card year-card-highlight year-card-featured">
            <span class="year-num">2027</span>
            <span class="year-text">학년도 입학생</span>
            <span class="year-grade">예비 1학년</span>
            <span class="year-arrow" aria-hidden="true">→</span>
          </a>
          <a href="guide.html?year=2026" class="year-card">
            <span class="year-num">2026</span>
            <span class="year-text">학년도 입학생</span>
            <span class="year-grade">현재 1학년</span>
            <span class="year-arrow" aria-hidden="true">→</span>
          </a>
          <a href="guide.html?year=2025" class="year-card">
            <span class="year-num">2025</span>
            <span class="year-text">학년도 입학생</span>
            <span class="year-grade">현재 2학년</span>
            <span class="year-arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </div>

      <div class="sub-links">
        <a href="curriculum.html" class="sub-link">📑 편제표 한눈에 보기</a>
        <a href="resources.html" class="sub-link">📄 참고자료</a>
        <a href="prerequisites.html" class="sub-link">📋 선이수 과목 정보</a>
        <a href="grading.html" class="sub-link">📊 성적처리방식</a>
      </div>
    </div>

    <footer class="hero-footer">
      <p>졸업 필수 192학점 · 교과 174학점 + 창의적 체험활동 18학점</p>
      <div class="hero-credits">
        <div class="hero-credits-row">
          <span class="hero-credits-label">제작</span>
          <span class="hero-credits-text">대평고등학교 교육과정부</span>
        </div>
        <div class="hero-credits-row">
          <span class="hero-credits-label">문의</span>
          <a href="mailto:ilovejos@korea.kr" class="hero-credits-email">ilovejos@korea.kr</a>
        </div>
        <p class="hero-credits-notice">© 대평고등학교 교육과정부 · 본 자료는 교내 학생·학부모 안내를 목적으로 제작되었으며, 무단 복제·재배포를 금합니다.</p>
      </div>
    </footer>
  </main>
</body>
</html>
