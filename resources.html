<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>참고자료 - 대평고등학교 교육과정 안내</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 참고자료 페이지 전용 스타일 */
    .res-hero {
      background: linear-gradient(135deg, var(--green-900) 0%, var(--green-700) 100%);
      color: #fff;
      padding: 64px 24px 48px;
      text-align: center;
    }
    .res-hero .section-eyebrow { color: var(--green-200); }
    .res-hero .section-title { color: #fff; }
    .res-hero .section-desc { color: var(--green-200); line-height: 1.7; }

    .res-section {
      padding: 48px 24px 80px;
      background: var(--bg-cream);
    }
    .res-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 자료 카드 */
    .res-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .res-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--ink-100);
    }
    .res-card-info {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .res-card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #fee2e2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .res-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-900);
      line-height: 1.4;
    }
    .res-card-sub {
      font-size: 12px;
      color: var(--ink-500);
      margin-top: 2px;
    }
    .res-card-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .res-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .res-btn-view {
      background: var(--green-700);
      color: #fff;
    }
    .res-btn-view:hover {
      background: var(--green-800);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }
    .res-btn-view.active {
      background: var(--green-900);
    }
    .res-btn-download {
      background: var(--green-50);
      color: var(--green-800);
    }
    .res-btn-download:hover {
      background: var(--green-100);
    }

    /* PDF 뷰어 */
    .res-pdf-wrap {
      display: none;
      background: #f0f0f0;
    }
    .res-pdf-wrap.active {
      display: block;
    }
    .res-pdf-wrap iframe {
      width: 100%;
      height: 80vh;
      border: none;
      display: block;
    }

    /* 빈 안내 (자료가 더 추가될 때 사용) */
    .res-more {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-500);
      font-size: 14px;
    }

    /* 반응형 */
    @media (max-width: 600px) {
      .res-hero { padding: 48px 20px 36px; }
      .res-hero .section-title { font-size: 22px; }
      .res-card-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .res-card-actions { width: 100%; }
      .res-btn { flex: 1; justify-content: center; }
      .res-pdf-wrap iframe { height: 60vh; }
    }
  </style>
</head>
<body class="page-guide">
  <header class="topbar">
    <a href="index.html" class="topbar-brand">
      <img src="logo.png" alt="" class="topbar-logo">
      <div class="topbar-titles">
        <span class="topbar-school">대평고등학교</span>
        <span class="topbar-sub">교육과정 안내</span>
      </div>
    </a>
    <div class="topbar-year" id="topbarYear">
      <span class="year-badge">참고자료</span>
    </div>
  </header>

  <section class="res-hero">
    <div>
      <p class="section-eyebrow">교육과정 참고자료</p>
      <h2 class="section-title">자료실</h2>
      <p class="section-desc">교육과정 선택에 도움이 되는 자료를 모아두었습니다.</p>
    </div>
  </section>

  <section class="res-section">
    <div class="res-inner">

      <!-- 자료 1: 2028 모집단위별 반영과목 -->
      <div class="res-card">
        <div class="res-card-header">
          <div class="res-card-info">
            <div class="res-card-icon">📄</div>
            <div>
              <div class="res-card-title">2028 모집단위별 반영과목 및 대학별 권장과목 자료집</div>
              <div class="res-card-sub">PDF · 대학 입시 과목 선택 참고</div>
            </div>
          </div>
          <div class="res-card-actions">
            <button class="res-btn res-btn-view" onclick="togglePdf(this, 'pdf1')">📖 열기</button>
            <a class="res-btn res-btn-download" href="2028_모집단위별_반영과목_및_대학별_권장과목_자료집.pdf" download>⬇ 다운로드</a>
          </div>
        </div>
        <div class="res-pdf-wrap" id="pdf1">
          <iframe src="2028_모집단위별_반영과목_및_대학별_권장과목_자료집.pdf" loading="lazy"></iframe>
        </div>
      </div>

      <!-- 자료 추가 시 위 구조를 복사해서 파일명/제목만 바꾸면 됩니다 -->

    </div>
  </section>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <img src="logo.png" alt="" class="footer-logo">
      <div class="footer-text">
        <p class="footer-school">대평고등학교 · DAEPYEONG HIGH SCHOOL</p>
        <p class="footer-sub">2022 개정 교육과정 안내</p>
      </div>
    </div>
  </footer>

  <script>
    function togglePdf(btn, id) {
      const wrap = document.getElementById(id);
      const isOpen = wrap.classList.contains('active');
      
      // 모든 PDF 닫기
      document.querySelectorAll('.res-pdf-wrap').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.res-btn-view').forEach(el => {
        el.classList.remove('active');
        el.textContent = '📖 열기';
      });

      if (!isOpen) {
        wrap.classList.add('active');
        btn.classList.add('active');
        btn.textContent = '📕 닫기';
      }
    }
  </script>
</body>
</html>
